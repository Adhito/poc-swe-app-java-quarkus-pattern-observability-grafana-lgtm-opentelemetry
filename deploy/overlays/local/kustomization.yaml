apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# MetalLB (and its IPAddressPool) and the ingress-nginx controller are NOT
# installed from this repo any more: since 2026-09-23 they are cluster
# infrastructure owned by the Platform repo
# (poc-platform-engineering-iac-vagrant-ansible-k8s-cluster-kubeadm-calico,
# addon_metallb / addon_ingress_nginx). Its pool is 192.168.56.240-.250 and the
# controller is pinned to .240, so the nip.io hostnames below are unchanged.
# Do NOT re-add MetalLB CRs here: two MetalLB installs fight over host ports,
# and an overlapping IPAddressPool is rejected by MetalLB's webhook.
resources:
- ../../base/observability
- ../../base/platform
- ../../base/apps

# hostnames are the only thing overlays change on ingresses (PRD section 8)
patches:
- path: patch-grafana-ingress.yaml
- path: patch-otlp-ingress.yaml
- path: patch-api-ingress.yaml
- path: patch-frontend-ingress.yaml

# tags rewritten by `make deploy` (kustomize edit set image) to the git SHA (D9);
# the eks overlay will point these names at ECR instead (Stage B)
images:
- name: 192.168.56.20:5000/carrier-service
  newName: 192.168.56.20:5000/carrier-service
  newTag: d8f6dc4
- name: 192.168.56.20:5000/frontend
  newName: 192.168.56.20:5000/frontend
  newTag: d8f6dc4
- name: 192.168.56.20:5000/notification-service
  newName: 192.168.56.20:5000/notification-service
  newTag: d8f6dc4
- name: 192.168.56.20:5000/order-service
  newName: 192.168.56.20:5000/order-service
  newTag: d8f6dc4
- name: 192.168.56.20:5000/shipping-service
  newName: 192.168.56.20:5000/shipping-service
  newTag: d8f6dc4
- name: 192.168.56.20:5000/stock-service
  newName: 192.168.56.20:5000/stock-service
  newTag: d8f6dc4
