apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  # Overrides the copy baked into grafana/otel-lgtm at
  # /otel-lgtm/grafana/conf/provisioning/datasources/grafana-datasources.yaml
  # (mounted with subPath so the rest of the provisioning dir is untouched).
  #
  # Faithful copy of the image's file EXCEPT tracesToLogsV2 (see note there).
  # Keep the Prometheus exemplarTraceIdDestinations block intact — Phase 5 (S6)
  # depends on it. `$$` is Grafana's escape for `$`; ConfigMap data is literal,
  # so these pass through to Grafana unchanged.
  grafana-datasources.yaml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://127.0.0.1:9090
        editable: true
        jsonData:
          timeInterval: 60s
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: tempo
              urlDisplayLabel: "Trace: $${__value.raw}"

      - name: Tempo
        type: tempo
        uid: tempo
        url: http://127.0.0.1:3200
        editable: true
        jsonData:
          tracesToLogsV2:
            customQuery: true
            datasourceUid: "loki"
            # CHANGED from the image default, which was:
            #   query: '{$${__tags}} | trace_id = "$${__trace.traceId}"'
            #   tags: [{key: "service.name", value: "service_name"}]
            # That scoped the log query to the clicked span's OWN service, so
            # clicking a frontend span searched {service_name="frontend"} — and
            # the browser exports traces only, never logs — always "No logs
            # found". Filtering on trace_id alone returns every log line from
            # every service in the trace, whichever span you click.
            # Loki requires at least one stream matcher, hence service_name=~".+".
            query: '{service_name=~".+"} | trace_id = "$${__trace.traceId}"'
            tags: []
          serviceMap:
            datasourceUid: "prometheus"
          search:
            hide: false
          nodeGraph:
            enabled: true
          lokiSearch:
            datasourceUid: "loki"

      - name: Loki
        type: loki
        uid: loki
        url: http://127.0.0.1:3100
        editable: true
        jsonData:
          derivedFields:
            - name: "trace_id"
              matcherType: "label"
              matcherRegex: "trace_id"
              url: "$${__value.raw}"
              datasourceUid: "tempo"
              urlDisplayLabel: "Trace: $${__value.raw}"

      - name: Pyroscope
        type: grafana-pyroscope-datasource
        uid: pyroscope
        url: http://127.0.0.1:4040
