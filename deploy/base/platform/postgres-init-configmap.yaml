apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: tracing-poc
data:
  # Runs on first start of an empty data dir (docker-entrypoint-initdb.d).
  # Data volume is emptyDir, so a pod restart re-seeds — convenient for the POC.
  # Gunpla catalog (cosmetic checkpoint, post-Stage-A). Quantities kept
  # identical to the original stub data so the demo shape (S1/S4/S5, plus the
  # insufficient-stock 409 path on the last row) is unchanged — only relabeled.
  01-init.sql: |
    CREATE TABLE stock (
        sku      text PRIMARY KEY,
        name     text NOT NULL,
        quantity int  NOT NULL
    );

    INSERT INTO stock (sku, name, quantity) VALUES
        ('MG RX-78 Gundam',       'Master Grade RX-78-2 Gundam',    42),
        ('RG Zaku II',            'Real Grade Zaku II',             17),
        ('PG Unicorn Gundam',     'Perfect Grade Unicorn Gundam',    8),
        ('HG Barbatos Lupus Rex', 'High Grade Barbatos Lupus Rex',   0);

    -- Owned by order-service (Java). Written on the synchronous path so the
    -- confirmation page has something to read back immediately.
    -- trace_id is stored so the UI can deep-link the order to its own trace.
    CREATE TABLE orders (
        order_id   text PRIMARY KEY,
        sku        text NOT NULL,
        quantity   int  NOT NULL,
        status     text NOT NULL,
        trace_id   text,
        created_at timestamptz NOT NULL DEFAULT now()
    );

    -- Owned by shipping-service (Go), written on the ASYNC path after the
    -- carrier quote — i.e. after the browser already has its 201. That lag is
    -- exactly what the confirmation page's polling makes visible.
    --
    -- Two services writing to one Postgres instance is a deliberate POC
    -- simplification: separate tables keep ownership clean without running a
    -- second database. Flagged in the runbook.
    CREATE TABLE shipments (
        shipment_id text PRIMARY KEY,
        order_id    text NOT NULL,
        carrier     text NOT NULL,
        cost_idr    numeric(12,2) NOT NULL,
        eta_days    int  NOT NULL,
        status      text NOT NULL,
        created_at  timestamptz NOT NULL DEFAULT now()
    );
    CREATE INDEX shipments_order_id_idx ON shipments (order_id);
