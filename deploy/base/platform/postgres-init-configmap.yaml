apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: tracing-poc
data:
  # Runs on first start of an empty data dir (docker-entrypoint-initdb.d).
  # Data volume is emptyDir, so a pod restart re-seeds — convenient for the POC.
  # Gunpla catalog (cosmetic checkpoint, post-Stage-A). Quantities kept
  # identical to the original stub data so the demo shape (S1/S4/S5, plus the
  # insufficient-stock 409 path on the last row) is unchanged — only relabeled.
  01-init.sql: |
    CREATE TABLE stock (
        sku      text PRIMARY KEY,
        name     text NOT NULL,
        quantity int  NOT NULL
    );

    INSERT INTO stock (sku, name, quantity) VALUES
        ('MG RX-78 Gundam',       'Master Grade RX-78-2 Gundam',    42),
        ('RG Zaku II',            'Real Grade Zaku II',             17),
        ('PG Unicorn Gundam',     'Perfect Grade Unicorn Gundam',    8),
        ('HG Barbatos Lupus Rex', 'High Grade Barbatos Lupus Rex',   0);
