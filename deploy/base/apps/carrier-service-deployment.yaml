apiVersion: apps/v1
kind: Deployment
metadata:
  name: carrier-service
  namespace: tracing-poc
  labels:
    app: carrier-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carrier-service
  template:
    metadata:
      labels:
        app: carrier-service
        # D5: excludes these pods from a future node-collection log DaemonSet
        logs.export/otlp: "true"
    spec:
      containers:
        - name: carrier-service
          # tag set per-overlay via kustomize `images:` (Makefile writes the git SHA)
          image: 192.168.56.20:5000/carrier-service:dev
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4317
            - name: OTEL_SERVICE_NAME
              value: carrier-service
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
